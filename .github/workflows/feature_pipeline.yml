name: Feature Pipeline

on:
  #schedule:
   # - cron: '0 */3 * * *'  # every 3 hours instead of hourly, reduces Hopsworks compute usage on the free tier
  workflow_dispatch:

jobs:
  fetch-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          CITIES: ${{ secrets.CITIES }}
        run: python src/data_fetch.py

      - name: Sync aqi_features_final with recent data
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python src/sync_final_features.py